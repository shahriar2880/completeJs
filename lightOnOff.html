<!DOCTYPE html>
<html>
<body>

<h2>What Can JavaScript Do?</h2>

<p>JavaScript can change HTML attribute values.</p>

<p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>

<button onclick="lightOn()">Turn on the light</button>

<img id="myImage" src="off.jpg" style="width:200px">

<button onclick="lightOff()">Turn Off the light</button>
<script>

 function lightOn(){
   document.getElementById("myImage").src='on.jpg';
 }
 function lightOff(){
   document.getElementById("myImage").src='off.jpg';

 }
</script>
</body>
</html>
